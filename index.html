<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7ec8e3" />
  <title>Leo Poly Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="lock-screen" class="overlay-screen">
    <div class="lock-card">
      <p class="brand">LEO POLY TRACK</p>
      <h1>Private track</h1>
      <p class="lock-copy">This racer only unlocks for Leo. Enter your personal key on this iPad.</p>
      <form id="unlock-form" autocomplete="off">
        <input
          id="unlock-input"
          type="password"
          enterkeyhint="go"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="Personal key"
          required
        />
        <button type="submit" id="unlock-btn">Unlock</button>
      </form>
      <p id="unlock-error" class="error" hidden>Wrong key. Try again.</p>
    </div>
  </div>

  <div id="menu-screen" class="overlay-screen" hidden>
    <div class="menu-card">
      <p class="brand">LEO POLY TRACK</p>
      <h1>Ready to race</h1>
      <p class="menu-copy">3 laps · arcade handling · built for your iPad</p>
      <button id="start-btn" type="button">Race</button>
      <button id="lock-device-btn" type="button" class="ghost">Lock this device</button>
    </div>
  </div>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-chip">
        <span class="label">LAP</span>
        <span id="lap-readout">1/3</span>
      </div>
      <div class="hud-chip">
        <span class="label">TIME</span>
        <span id="time-readout">0:00.00</span>
      </div>
      <div class="hud-chip">
        <span class="label">BEST</span>
        <span id="best-readout">—</span>
      </div>
    </div>
    <div class="hud-speed">
      <span id="speed-readout">0</span>
      <span class="unit">km/h</span>
    </div>
    <button id="pause-btn" type="button" aria-label="Pause">II</button>
  </div>

  <div id="touch-controls" hidden>
    <div class="steer-pad" id="steer-pad">
      <button type="button" class="steer-btn" data-dir="-1" aria-label="Steer left">◀</button>
      <button type="button" class="steer-btn" data-dir="1" aria-label="Steer right">▶</button>
    </div>
    <div class="drive-pad">
      <button type="button" class="drive-btn" id="brake-btn" aria-label="Brake">BRAKE</button>
      <button type="button" class="drive-btn primary" id="accel-btn" aria-label="Accelerate">GAS</button>
    </div>
  </div>

  <div id="pause-screen" class="overlay-screen" hidden>
    <div class="menu-card">
      <p class="brand">PAUSED</p>
      <h1>Take a breath</h1>
      <button id="resume-btn" type="button">Resume</button>
      <button id="restart-btn" type="button" class="ghost">Restart race</button>
      <button id="quit-btn" type="button" class="ghost">Back to menu</button>
    </div>
  </div>

  <div id="finish-screen" class="overlay-screen" hidden>
    <div class="menu-card">
      <p class="brand">FINISH</p>
      <h1 id="finish-title">Nice run</h1>
      <p id="finish-time" class="menu-copy">0:00.00</p>
      <button id="race-again-btn" type="button">Race again</button>
      <button id="finish-menu-btn" type="button" class="ghost">Menu</button>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
